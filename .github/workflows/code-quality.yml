name: RhymeOrbit code quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax-and-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run code-quality checks
        run: npm test
