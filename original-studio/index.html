<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RhymeOrbit Original Studio</title><style>body{font:15px system-ui;background:#f6f4fb;color:#211d32;margin:0}main{max-width:920px;margin:auto;padding:24px}section{background:white;border:1px solid #e4deee;border-radius:16px;padding:20px;margin:16px 0}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;margin:5px;background:#6336c7;color:white;cursor:pointer}button:disabled{opacity:.4} .grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px}.step{padding:0;height:32px;background:#e8e3f0;margin:0}.step.on{background:#8b5cf6}.row{margin:15px 0}label{display:inline-block;min-width:60px}audio{width:100%;margin-top:12px}small{color:#5e5870}</style><main><h1>RhymeOrbit · Original Studio</h1><p>Human-made beats and real vocal takes. No generative AI.</p><section><h2>16-step Beat Maker</h2><p><label>BPM</label><input id="bpm" type="number" min="50" max="200" value="100"><button id="play">Play</button><button id="stop">Stop</button></p><div id="sequencer"></div><small>All sounds synthesized locally. Headphones recommended.</small></section><section><h2>Voice Studio</h2><button id="record">Record vocal</button><button id="finish" disabled>Stop recording</button><div class="row"><label>Gain</label><input id="gain" type="range" min="0" max="2" value="1" step=".05"><label>Brightness</label><input id="tone" type="range" min="200" max="12000" value="8000"></div><audio id="preview" controls></audio><p><button id="save" disabled>Download recording</button><button id="manifest" disabled>Download provenance</button></p><small>Microphone permission required; raw vocal is kept locally unless you export it.</small></section><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id), tracks=['Kick','Snare','Hi-hat'],patterns=[[0,4,8,12],[4,12],[2,6,10,14]],seq=$('sequencer');let ctx,timer,step=0,stream,rec,chunks=[],blob,started,hash;
tracks.forEach((name,i)=>{let row=document.createElement('div');row.className='row';let title=document.createElement('div');title.textContent=name;row.append(title);let grid=document.createElement('div');grid.className='grid';for(let j=0;j<16;j++){let b=document.createElement('button');b.className='step'+(patterns[i].includes(j)?' on':'');b.setAttribute('aria-label',name+' step '+(j+1));b.setAttribute('aria-pressed',patterns[i].includes(j));b.onclick=()=>{let index=patterns[i].indexOf(j);if(index<0)patterns[i].push(j);else patterns[i].splice(index,1);b.classList.toggle('on');b.setAttribute('aria-pressed',patterns[i].includes(j))};grid.append(b)}row.append(grid);seq.append(row)});
function sound(type,time){let osc=ctx.createOscillator(),gain=ctx.createGain(),noise=type===2;osc.type=noise?'square':'sine';osc.frequency.setValueAtTime(type===0?140:type===1?190:6000,time);if(type===0)osc.frequency.exponentialRampToValueAtTime(45,time+.14);gain.gain.setValueAtTime(type===2?.035:.3,time);gain.gain.exponentialRampToValueAtTime(.001,time+(type===2?.045:.16));osc.connect(gain).connect(ctx.destination);osc.start(time);osc.stop(time+.18)}
$('play').onclick=async()=>{if(timer)return;ctx??=new AudioContext();await ctx.resume();let tick=()=>{let t=ctx.currentTime+.01;tracks.forEach((_,i)=>{if(patterns[i].includes(step))sound(i,t)});step=(step+1)%16};tick();timer=setInterval(tick,60000/(Math.max(50,Math.min(200,Number($('bpm').value)||100))*4));$('status').textContent='Sequencer playing'};
$('stop').onclick=()=>{clearInterval(timer);timer=null;step=0;$('status').textContent='Stopped'};
$('record').onclick=async()=>{try{if(!window.MediaRecorder)throw Error('Recording unsupported');stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);started=new Date().toISOString();rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});$('preview').src=URL.createObjectURL(blob);hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))).map(b=>b.toString(16).padStart(2,'0')).join('');$('save').disabled=false;$('manifest').disabled=false;stream.getTracks().forEach(t=>t.stop());$('status').textContent='Vocal captured locally'};rec.start();$('record').disabled=true;$('finish').disabled=false;$('status').textContent='Recording real microphone audio'}catch(e){$('status').textContent=e.message}};
$('finish').onclick=()=>{if(rec?.state==='recording')rec.stop();$('record').disabled=false;$('finish').disabled=true};
function download(data,name){let url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
$('save').onclick=()=>{if(blob)download(blob,'original-vocal.'+(blob.type.includes('mp4')?'m4a':'webm'))};
$('manifest').onclick=()=>{if(!blob)return;download(new Blob([JSON.stringify({schema:'rhymeorbit.provenance.v1',source:'microphone',recordedAt:started,exportedAt:new Date().toISOString(),sha256:hash,mimeType:blob.type,bytes:blob.size,processing:'none; raw browser capture',verification:'self-reported capture evidence; not platform certification'},null,2)],{type:'application/json'}),'vocal-provenance.json')};
</script></html>
