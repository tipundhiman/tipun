const roLanguages = [

const roNativeNames = {
  Hindi:'हिन्दी', Haryanvi:'हरियाणवी', Punjabi:'ਪੰਜਾਬੀ',
  Bhojpuri:'भोजपुरी', Bengali:'বাংলা', Marathi:'मराठी',

};
function roFilterLanguages(query){
  const el=$('songLanguage');
  if(!el)return;
  const selected=el.value;
  const q=String(query||'').trim().toLocaleLowerCase();
  const matches=roLanguages.filter(x=>
    x.toLocaleLowerCase().includes(q)||
    (roNativeNames[x]||'').toLocaleLowerCase().includes(q)
  );
  if(!matches.includes(selected))matches.unshift(selected);
  el.replaceChildren(...matches.map(x=>{
    const opt=document.createElement('option');
    opt.value=x;
    opt.textContent=x+(roNativeNames[x]?' — '+roNativeNames[x]:'');
    return opt;
  }));
  el.value=selected;
}
async function roCopyLyrics(){
  const lyrics=$('songLyrics')?.value||'';
  if(!lyrics.trim())return toast('Write some lyrics first');
  try{
    await navigator.clipboard.writeText(lyrics);
    toast('Lyrics copied ✓');
  }catch(e){
    const field=$('songLyrics');
    field.focus();field.select();
    toast('Select the lyrics and press Ctrl+C to copy');
  }
}

function go(page){if(page==='video'){window.location.assign('/video-maker');return}if(page==='sing'){window.location.assign('/sing-your-song');return}state.mobile=false;if(['studio','projects','downloads','profile','match'].includes(page)&&!state.user){state.page=page;render();requireUser(page);return}state.page=page;state.search='';state.genre='All';history.replaceState(null,'','#'+page);render();window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
function roObserveLandingMotion(){
  window.roLandingObserver?.disconnect();
  if(state.page!=='home'||!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const elements=[...document.querySelectorAll('.feature,.editorial,.quote')];
  const observer=new IntersectionObserver((entries,instance)=>{
    for(const entry of entries)if(entry.isIntersecting){entry.target.classList.add('ro-seen');instance.unobserve(entry.target)}
  },{threshold:.12,rootMargin:'0px 0px -24px 0px'});

}

// Automatically persist studio drafts locally without navigating away or deleting other projects.
let roAutosaveTimer;
function roInstallStudioAutosave(){
  const fields=['songTitle','songGenre','songMood','songLanguage','songLyrics','roMusicStyle','roVocalVoice'];
  const userKey=state.user?.id||'guest';
  const draftKey='ro_studio_active_draft_'+userKey;
  let id=state.editId||localStorage.getItem(draftKey);
  if(!state.editId&&id){
    const saved=state.projects.find(p=>p.id===id);
    if(saved){
      for(const [field,value] of Object.entries({songTitle:saved.title==='Untitled Song'?'':saved.title,songGenre:saved.genre,songMood:saved.mood,songLanguage:saved.language,songLyrics:saved.lyrics,roMusicStyle:saved.musicStyle,roVocalVoice:saved.voice})){
        const el=document.getElementById(field);if(el&&value!=null)el.value=value;
      }
      countWords();
    }
  }
  function persist(){
    if(state.page!=='studio'||!state.user)return;
    const read=k=>document.getElementById(k)?.value||'';
    const title=read('songTitle').trim(),lyrics=read('songLyrics').trim();
    if(!title&&!lyrics)return;
    if(!id)id='p'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const previous=state.projects.find(p=>p.id===id)||{};
    const data={...previous,id,title:title||'Untitled Song',lyrics,genre:read('songGenre'),mood:read('songMood'),language:read('songLanguage'),musicStyle:read('roMusicStyle'),voice:read('roVocalVoice'),updated:new Date().toISOString()};
    const index=state.projects.findIndex(p=>p.id===id);
    if(index>=0)state.projects[index]=data;else state.projects.unshift(data);
    if(put('projects',state.projects)){
      localStorage.setItem(draftKey,id);
      const status=document.getElementById('roAutosaveStatus');if(status)status.textContent='✓ Autosaved in this browser';
    }
  }
  window.roPersistStudioDraft=persist;
  for(const key of fields){
    const el=document.getElementById(key);if(!el)continue;
    const onChange=()=>{clearTimeout(roAutosaveTimer);roAutosaveTimer=setTimeout(persist,600)};
    el.addEventListener('input',onChange);el.addEventListener('change',onChange);
  }
  const status=document.getElementById('roAutosaveStatus');if(status)status.textContent='Autosave enabled';
}

function saveProject(){if(!requireUser('studio'))return;const title=$('songTitle').value.trim(),lyrics=$('songLyrics').value.trim();if(!title||!lyrics)return toast('Add a title and lyrics before saving');const data={id:state.editId||('p'+Date.now()),title,lyrics,genre:$('songGenre').value,mood:$('songMood').value,language:$('songLanguage').value,updated:new Date().toISOString()};const i=state.projects.findIndex(p=>p.id===data.id);if(i>=0)state.projects[i]=data;else state.projects.unshift(data);if(put('projects',state.projects)){state.editId=null;go('projects');toast('Your draft was saved in this browser ✦')}}

function exportProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;const blob=new Blob([`${p.title}\nGenre: ${p.genre}\nMood: ${p.mood}\nLanguage: ${p.language}\n\n${p.lyrics}`],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=p.title.replace(/[^a-z0-9 _-]/gi,'').trim().slice(0,50)||'RhymeOrbit-lyrics';a.download+='.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function songDoctor(){const text=$('songLyrics').value.trim(),out=$('doctorResult');if(!text){out.innerHTML='<div class="note">Write some lyrics first.</div>';return}const lines=text.split('\n').map(s=>s.trim()).filter(Boolean),words=text.split(/\s+/),headers=lines.filter(x=>/^\[(verse|chorus|bridge|hook|intro|outro)/i.test(x)),lengths=lines.filter(x=>!x.startsWith('[')).map(x=>x.split(/\s+/).length),avg=lengths.length?Math.round(lengths.reduce((a,b)=>a+b,0)/lengths.length):0;out.innerHTML=`<div class="note"><b>Writing snapshot</b><p>${words.length} words · ${lines.length} non-empty lines · ${headers.length} section markers</p><p>Average line length: ${avg} words. ${headers.length?'Good: your draft uses section labels.':'Try [Verse] and [Chorus] labels for structure.'} ${avg>12?'Consider shorter lines for easier phrasing.':'Experiment with repetition and contrast to make your hook memorable.'}</p></div>`}
function vibeBrief(){const v=$('vibeInput').value.trim();if(!v)return toast('Describe a feeling or moment first');$('vibeResult').innerHTML=`<div class="note"><b>Your writing brief</b><p>Scene: ${esc(v.slice(0,140))}</p><p>Write a verse that captures the setting through sensory detail, then a chorus built around one unforgettable emotional phrase. Try a contrast between what the narrator says and what they really feel.</p></div>`}
function like(id){if(!requireUser('discover'))return;state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];put('likes',state.likes);render()}
function follow(id){if(!requireUser('community'))return;state.follows=state.follows.includes(id)?state.follows.filter(x=>x!==id):[...state.follows,id];put('follows',state.follows);render()}
function saveProfile(){const n=$('profileName').value.trim();if(!n)return toast('Please enter a display name');state.user.name=n;state.user.bio=$('profileBio').value.trim();put('user',state.user);render();toast('Profile saved in this browser')}
function askHelp(){roToggleOrbitHelp(true)}
function supportEmail(){const m=$('supportInput').value.trim();if(!m)return toast('Describe your request first');location.href='mailto:dtipun@gmail.com?subject='+encodeURIComponent('RhymeOrbit support')+'&body='+encodeURIComponent(m)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeAuth()});
const initial=location.hash.slice(1);if(['home','discover','studio','projects','downloads','listen','community','match','profile','help','about','privacy','terms'].includes(initial))state.page=initial;render();
</script>

<script>
(function(){
  'use strict';

  let adminOpen = false;
  let adminVerified = false;
  let lastUserId = null;

  const safe = value => String(value ?? '')
    .replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));

  function supabaseClient(){
    try{
      if(typeof sb !== 'undefined' && sb?.auth) return sb;
    }catch(e){}
    return window.sb?.auth ? window.sb : null;
  }

  async function sessionInfo(){
    const client = supabaseClient();
    if(!client) return null;
    const result = await client.auth.getSession();
    const session = result.data?.session;
    if(result.error || !session?.access_token) return null;
    return session;
  }

  async function adminRequest(path, options = {}){
    const session = await sessionInfo();
    if(!session) throw new Error('Please log in again.');

    const response = await fetch(path,{
      ...options,
      headers:{
        'Authorization':'Bearer '+session.access_token,
        'Content-Type':'application/json',
        ...(options.headers || {})
      },
      cache:'no-store'
    });

    const result = await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(result.error || 'Request failed');
    }
    return result;
  }

  async function checkAdmin(){
    const button = document.getElementById('roAdminEntry');
    try{
      const session = await sessionInfo();
      const userId = session?.user?.id || null;

      if(!userId){
        adminVerified = false;
        lastUserId = null;
        button?.remove();
        if(adminOpen) closeAdmin();
        return;
      }

      if(userId !== lastUserId){
        adminVerified = false;
        button?.remove();
        if(adminOpen) closeAdmin();
      }
      lastUserId = userId;

      const result = await adminRequest('/api/admin/overview');
      adminVerified = result.isAdmin === true;

      if(adminVerified && !document.getElementById('roAdminEntry')){
        const entry = document.createElement('button');
        entry.id = 'roAdminEntry';
        entry.textContent = '♛ Admin Dashboard';
        entry.onclick = openAdmin;
        document.body.appendChild(entry);
      }

      if(!adminVerified) button?.remove();

    }catch(e){
      adminVerified = false;
      document.getElementById('roAdminEntry')?.remove();
      if(adminOpen) closeAdmin();
    }
  }

  function closeAdmin(){
    adminOpen = false;
    document.getElementById('roAdminOverlay')?.remove();
  }

  function countItems(items, test){
    return Array.isArray(items) ? items.filter(test).length : 0;
  }

  function table(headers, rows){
    if(!rows.length){
      return '<p class="ro-admin-muted">No records found.</p>';
    }
    return '<div class="ro-admin-table-wrap"><table class="ro-admin-table"><thead><tr>'+
      headers.map(h=>'<th>'+safe(h)+'</th>').join('')+
      '</tr></thead><tbody>'+
      rows.map(row=>'<tr>'+
        row.map(value=>'<td>'+safe(value)+'</td>').join('')+
      '</tr>').join('')+
      '</tbody></table></div>';
  }

  async function openAdmin(){
    if(adminOpen) return;

    adminOpen = true;
    const overlay = document.createElement('div');
    overlay.id = 'roAdminOverlay';
    overlay.innerHTML = `
      <div class="ro-admin-wrap">
        <div class="ro-admin-top">
          <div>
            <div class="eyebrow">RHYMEORBIT / PRIVATE CONTROL CENTER</div>
            <h1 class="ro-admin-title">Admin <span class="serif">Dashboard.</span></h1>
          </div>
          <button class="ro-admin-btn secondary" id="roAdminClose">✕ Close</button>
        </div>
        <div id="roAdminContent" class="ro-admin-card">Loading secure dashboard...</div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('roAdminClose').onclick = closeAdmin;
    await loadAdmin();
  }

  async function loadAdmin(){
    const target = document.getElementById('roAdminContent');
    if(!target) return;

    try{
      const data = await adminRequest('/api/admin/overview');
      const diagnostics=await adminRequest('/api/admin/music-readiness').catch(()=>null);

      if(data.isAdmin !== true){
        throw new Error('Admin access not verified.');
      }

      const subscriptions = data.subscriptions || [];
      const usage = data.monthlyUsage || [];
      const generations = data.recentGenerations || [];

      const premium = countItems(subscriptions,
        x=>x.plan === 'premium' && x.status === 'active');

      const completed = countItems(generations,
        x=>x.status === 'completed');

      const used = usage.reduce(
        (sum,x)=>sum + Number(x.songs_used || 0),0
      );

      const reserved = usage.reduce(
        (sum,x)=>sum + Number(x.songs_reserved || 0),0
      );

      target.className = '';
      target.innerHTML = `
        <div class="ro-admin-grid">
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Premium subscriptions in loaded records</span>
            <strong>${premium}</strong>
          </div>
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Songs used in loaded monthly records</span>
            <strong>${used}</strong>
          </div>
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Reserved song credits in loaded records</span>
            <strong>${reserved}</strong>
          </div>
        </div>

        <div class="ro-admin-grid">
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Admin accounts in response</span>
            <strong>${Number(data.adminCount || 0)}</strong>
          </div>
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Completed generations in loaded records</span>
            <strong>${completed}</strong>
          </div>
          <div class="ro-admin-card">
            <span class="ro-admin-muted">Reporting month (UTC)</span>
            <strong style="font-size:23px">${safe(data.monthStart || '-')}</strong>
          </div>
        </div>

        <section class="ro-admin-card" style="margin-bottom:20px">
          <div class="eyebrow">SUBSCRIPTION MANAGEMENT</div>
          <h2>Manage creator plans</h2>
          <p class="ro-admin-muted">
            Use the Supabase Auth user UUID to manage an existing user.
            This is a manual admin action, not a payment confirmation.
          </p>
          <form id="roSubscriptionForm">
            <label class="ro-admin-label" for="roTargetUser">User ID (UUID)</label>
            <input class="ro-admin-input" id="roTargetUser"
              required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">

            <label class="ro-admin-label" for="roPlan">Subscription plan</label>
            <select class="ro-admin-input" id="roPlan">
              <option value="free">Free — 3 songs/month</option>
              <option value="premium">Premium</option>
            </select>

            <label class="ro-admin-label" for="roLimit">Monthly song limit</label>
            <input class="ro-admin-input" id="roLimit"
              type="number" min="1" max="10000" value="3" required>

            <label class="ro-admin-label" for="roExpiry">
              Expiration (optional)
            </label>
            <input class="ro-admin-input" id="roExpiry"
              type="datetime-local">

            <button class="ro-admin-btn" type="submit">
              Save subscription ↗
            </button>
            <p id="roAdminStatus" class="ro-admin-status" role="status"></p>
          </form>
        </section>

        <section class="ro-admin-card" style="margin-bottom:20px">
          <div class="ro-admin-top">
            <h2>Subscriptions</h2>
            <span class="ro-admin-muted">Up to 100 latest records</span>
          </div>

  function roPaintSongCards(root,items){
    const existing=new Map(Array.from(root.children).filter(n=>n.dataset?.songId).map(n=>[n.dataset.songId,n]));
    const cards=items.map(item=>{
      const card=existing.get(String(item.id));
      const sig=JSON.stringify([item.title||'',item.voice||'',roSongStatus(item),item.url||'',item.proxyUrl||'',!!item.cloudSaved]);
      if(card?.dataset.songSignature===sig)return card;
      const rebuilt=roMakeSongCard(item);
      // Preserve a playing audio element when only the surrounding card needs an update.
      const oldPlayer=card?.querySelector('.ro-song-player');
      const newPlayer=rebuilt.querySelector('.ro-song-player');
      if(oldPlayer&&newPlayer&&oldPlayer.dataset.audioUrl===newPlayer.dataset.audioUrl)
        newPlayer.replaceWith(oldPlayer);
      const oldDrawer=card?.querySelector('.ro-song-drawer');
      const newDrawer=rebuilt.querySelector('.ro-song-drawer');
      if(oldDrawer&&newDrawer)newDrawer.open=oldDrawer.open;
      return rebuilt;
    });
    for(let i=0;i<cards.length;i++){
      if(root.children[i]!==cards[i])root.insertBefore(cards[i],root.children[i]||null);
    }
    while(root.children.length>cards.length)root.lastElementChild.remove();
  }
  function roUpdatePendingClocks(){

          timer.textContent='Time elapsed: '+roClock(Math.floor((Date.now()-started)/1000))+' · waiting for audio';
        }else timer.textContent='Waiting for audio · progress percentage unavailable';
      });
    }
  }

  window.roRefreshMusicCredits=async function(){
    const out=document.getElementById('roSongCreditStatus'),button=document.getElementById('roSongGenerate');

    try{
      const session=(await sb.auth.getSession()).data.session;

      const responses=await Promise.all([
        fetch('/api/music/credits',{headers:{Authorization:'Bearer '+session.access_token}}),
        fetch('/api/music/status')
      ]);
      const balance=await responses[0].json().catch(()=>({}));
      const status=await responses[1].json().catch(()=>({}));
      if(!responses[0].ok)throw Error(balance.error||'Song balance unavailable');
      const limit=Math.max(0,Math.floor(Number(balance.monthlyLimit)||0));
      const remaining=Math.max(0,Math.min(limit,Number(balance.remaining)||0));
      const tier=['premium','pro'].includes(balance.plan)?balance.plan.toUpperCase():'Free';
      if(responses[1].ok&&status.publicGenerationEnabled===false){
        out.textContent='♫ Song generation is temporarily unavailable. Your monthly balance is '+remaining+'/'+limit+'.';
        if(button)button.disabled=true;
        return;
      }
      out.textContent='♫ '+remaining+' of '+limit+' '+tier+' songs left this month · Resets monthly (UTC)';
      if(button)button.disabled=remaining===0||!!window.roSongBusy;
    }catch(error){out.textContent='Monthly song balance unavailable right now.';if(button)button.disabled=!!window.roSongBusy}

  async function roCloudToken(){return (await sb?.auth.getSession())?.data?.session?.access_token||null}
  window.roLoadCloudSongs=async function({force=false}={}){
    if(window.roCloudSyncRunning)return;
    const token=await roCloudToken();if(!token)return;
    window.roCloudSyncRunning=true;
    try{
      const response=await fetch('/api/music/library',{headers:{Authorization:'Bearer '+token}});
      if(!response.ok){
        const failure=await response.json().catch(()=>({}));
        window.roCloudLibraryError=failure.error||'Private library temporarily unavailable';
        window.roRenderMyStudioSongs?.();
        return;
      }
      window.roCloudLibraryError=null;
      const data=await response.json();
      for(const item of data.items||[]){
        const existing=roLibraryRead().find(x=>x.id===item.id)||{};
        // Never erase an already playable link when a temporary cloud request returns null.
        const url=roIsAudioUrl(item.url)?item.url:(existing.url||null);
        const proxyUrl=roIsPrivateAudioUrl(item.proxyUrl)?item.proxyUrl:(existing.proxyUrl||null);
        const status=url||proxyUrl?'Cloud saved':(item.status||existing.status||'Pending');
        const reuseExisting=!force&&existing.cloudSaved&&existing.signedAt&&
          (Date.now()-Date.parse(existing.signedAt)<45*60*1000);
        const currentUrl=reuseExisting&&existing.url?existing.url:url;
        const currentProxyUrl=reuseExisting&&existing.proxyUrl?existing.proxyUrl:proxyUrl;
        roLibraryUpsert(item.id,{
          title:item.title||existing.title||'My AI Song',
          voice:item.voice||existing.voice||'auto',
          status,
          url:currentUrl,
          proxyUrl:currentProxyUrl,
          lyrics:existing.lyrics||'',
          cloudSaved:!!item.cloudSaved,
          createdAt:existing.createdAt||item.createdAt||null,
          signedAt:reuseExisting?existing.signedAt:new Date().toISOString()
        });
      }
      if(state.page==='studio'){
        const pending=(data.items||[]).find(item=>
          /pending|processing|checking/i.test(item.status||'')&&
          !roActiveSongPolls.has(String(item.id))&&
          !window.roAutoRecoveryStarted?.has(String(item.id)));
        if(pending){
          if(!window.roAutoRecoveryStarted)window.roAutoRecoveryStarted=new Set();
          const taskId=String(pending.id);
          window.roAutoRecoveryStarted.add(taskId);
          Promise.resolve().then(()=>window.roRecoverTrebloSong?.(taskId))
            .catch(()=>{});
        }
      }
      if(state.page==='downloads')window.roRenderMyStudioSongs?.();
    }catch(error){
      window.roCloudLibraryError='Connection unavailable; retry syncing your song library.';
    }finally{window.roCloudSyncRunning=false}
  };
  window.roSaveSongToCloud=async function(id,details={}){
    const token=await roCloudToken();if(!token)return;
    const existing=roLibraryRead().find(x=>x.id===id)||{};
    const response=await fetch('/api/music/library',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({taskId:id,title:details.title||existing.title||'My AI Song',voice:details.voice||existing.voice||'auto'})});
    const result=await response.json().catch(()=>({error:'Cloud save endpoint returned an invalid response (HTTP '+response.status+')'}));
    if(!response.ok){roLibraryUpsert(id,{cloudSaved:false,status:'Cloud save failed'});toast(result.error||'Cloud save failed');return {ok:false,error:result.error||'Cloud save failed'}}
    roLibraryUpsert(id,{cloudSaved:result.cloudSaved,status:result.cloudSaved?'Cloud saved':'Pending cloud save',
      url:result.url||existing.url,proxyUrl:result.proxyUrl||existing.proxyUrl||null,signedAt:new Date().toISOString()});

  function roClock(sec){if(!Number.isFinite(sec)||sec<0)return '0:00';return Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0')}
  function roAttachTime(audio){
    if(!audio||audio.dataset.roTimeAttached)return;
    audio.dataset.roTimeAttached='1';
    const timeline=document.createElement('div');timeline.className='ro-song-timeline';
    const elapsed=document.createElement('span');elapsed.textContent='0:00';
    const seek=document.createElement('input');seek.type='range';seek.min='0';seek.max='1000';seek.step='1';seek.value='0';seek.disabled=true;
    seek.setAttribute('aria-label','Seek within song');
    const duration=document.createElement('span');duration.textContent='--:--';
    timeline.append(elapsed,seek,duration);
    audio.insertAdjacentElement('afterend',timeline);
    const update=()=>{
      const total=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:0;
      elapsed.textContent=roClock(audio.currentTime||0);
      duration.textContent=total?roClock(total):'--:--';
      seek.disabled=!total;seek.value=total?String(Math.round(Math.max(0,Math.min(1,audio.currentTime/total))*1000)):'0';
      seek.setAttribute('aria-valuetext',elapsed.textContent+' of '+duration.textContent);
    };
    seek.addEventListener('input',()=>{
      if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*(Number(seek.value)/1000);
    });
    ['loadedmetadata','durationchange','timeupdate','seeked','pause','ended','loadeddata'].forEach(event=>audio.addEventListener(event,update));
    update();
  }
  window.roAttachSongTimers=function(root=document){

  function showTrebloPlayer(box,url,id){
    box.replaceChildren();
    const existing=roLibraryRead().find(item=>item.id===id)||{};
    const title=existing.title||localStorage.getItem('ro_treblo_song_title_'+id)||'My AI Song';
    roLibraryUpsert(id,{title,status:'Ready',url,cloudSaved:existing.cloudSaved||false});
    const card=document.createElement('section');
    card.className='ro-song-entry';
    const name=document.createElement('h3');name.textContent=title;name.style.margin='0 0 6px';
    const subtitle=document.createElement('p');subtitle.className='muted small';
    subtitle.textContent='♫ Your full song is ready. You can also play it in My Generated Songs.';
    card.append(name,subtitle,roAudioPlayer(url,id,existing.proxyUrl));box.append(card);
    const note=document.createElement('p');note.className='ro-song-note';
    note.setAttribute('role','status');card.append(note);
    if(existing.cloudSaved){note.textContent='✓ Secure cloud backup available.';return}
    note.textContent='Saving your song to private cloud storage…';
    window.roSaveSongToCloud(id,{title}).then(result=>{
      note.textContent=result?.ok?'✓ Song safely backed up in your account.':
        'Audio plays, but cloud backup could not be confirmed. Use Refresh audio later.';
    }).catch(()=>{
      note.textContent='Audio is playable, but cloud backup is pending. Please retry later.';
    });
  }
  const roActiveSongPolls=new Set();
  window.roRecoverTrebloSong=async function(id){
    const box=document.getElementById('roMurekaResult');
    if(!box)return;
    id=String(id||document.getElementById('roTrebloTaskId')?.value||localStorage.getItem(trebleStorageKey)||'').trim();
    if(!id){box.textContent='Choose a song in your library to check its progress.';return}
    if(!/^[a-zA-Z0-9_-]{1,100}$/.test(id)){box.textContent='Song reference unavailable. Please choose a saved song.';return}
    if(!sb?.auth){box.textContent='Sign in to access your song.';return}
    if(roActiveSongPolls.has(id)){box.textContent='This song is already being checked. Its progress is shown below.';return}
    const existing=roLibraryRead().find(song=>song.id===id)||{};
    if(roIsAudioUrl(existing.url)&&/ready|cloud saved/i.test(existing.status||'')){
      showTrebloPlayer(box,existing.url,id);return;
    }
    let session;
    try{session=(await sb.auth.getSession()).data?.session}catch{}
    if(!session?.access_token){box.textContent='Your login session expired. Sign in again to resume your song.';return}
    localStorage.setItem(trebleStorageKey,id);
    const title=existing.title||localStorage.getItem('ro_treblo_song_title_'+id)||'My AI Song';
    roLibraryUpsert(id,{title,status:'Processing',createdAt:existing.createdAt||new Date().toISOString()});
    roActiveSongPolls.add(id);
    box.textContent='♫ Composing your music and vocals… Check the progress in My Generated Songs.';
    try{
      for(let attempt=0;attempt<90;attempt++){
        if(state.page!=='studio'||document.getElementById('roMurekaResult')!==box){
          return; // The saved task can be resumed from the library later.
        }
        const response=await fetch('/api/music/prediction/'+encodeURIComponent(id),{
          headers:{Authorization:'Bearer '+session.access_token}
        });
        const task=await response.json().catch(()=>({error:'Song status response unavailable'}));
        if(!response.ok)throw Error(task.error||'Song progress could not be checked right now.');
        if(task.status==='failed'){
          roLibraryUpsert(id,{status:'Failed'});
          box.textContent='Song generation failed. If a song credit was charged, it will be restored.';
          return;
        }
        if(task.status==='succeeded'&&roIsAudioUrl(task.output)){
          showTrebloPlayer(box,String(task.output),id);
          return;
        }
        if(attempt<89)await new Promise(resolve=>setTimeout(resolve,5000));
      }
      roLibraryUpsert(id,{status:'Waiting'});
      box.textContent='Your song is taking longer than expected. It remains in My Generated Songs. Use Check progress later; there is no need to spend another credit.';
    }catch(error){
      roLibraryUpsert(id,{status:'Waiting'});
      box.textContent=(error.message||'Song service temporarily unavailable')+'. Use Check progress on your saved song; no new generation is needed.';
    }finally{
      roActiveSongPolls.delete(id);
    }
  };
  window.roStartMurekaTest=async function(){
    const text=document.getElementById('songLyrics')?.value.trim()||'';
    const style=document.getElementById('roMusicStyle')?.value.trim()||'';
    const box=document.getElementById('roMurekaResult');
    const button=document.getElementById('roSongGenerate');
    if(!box)return;
    if(text.length<5){box.textContent='Enter a song idea or lyrics above.';return}
    if(!sb||!state.user){box.textContent='Sign in to generate songs.';return}
    const rights=document.getElementById('roSongRightsConfirmed');
    if(!rights?.checked){box.textContent='Please confirm you own or are authorized to use the lyrics and references.';rights?.focus();return}
    if(window.roSongBusy)return;
    window.roSongBusy=true;
    if(button)button.disabled=true;
    box.textContent='♫ Starting your song with vocals…';
    try{
      const session=(await sb.auth.getSession()).data.session;
      if(!session?.access_token)throw Error('Your session expired. Log in again.');
      const response=await fetch('/api/music/generate',{method:'POST',headers:{
        'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},
        body:JSON.stringify({lyrics:text,prompt:style,rightsConfirmed:true,title:document.getElementById('songTitle')?.value||'My AI Song',genre:document.getElementById('songGenre')?.value||'Pop',
          mood:document.getElementById('songMood')?.value||'Creative',
          language:document.getElementById('songLanguage')?.value||'Hindi',
          voice:document.getElementById('roVocalVoice')?.value||'auto'})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(data.error||'Could not start your song.');
      if(!data.id)throw Error('Song started without a tracking ID. Contact support.');
      const id=String(data.id);
      localStorage.setItem(trebleStorageKey,id);
      const title=(document.getElementById('songTitle')?.value||'My AI Song').trim().slice(0,100);
      localStorage.setItem('ro_treblo_song_title_'+id,title);
      roLibraryUpsert(id,{title,lyrics:text,voice:document.getElementById('roVocalVoice')?.value||'auto',status:'Processing'});
      roSaveLyricsWithSong(id,text).catch(error=>console.warn('Song lyrics R2 sync pending:',error.message));
      window.roRefreshMusicCredits?.();
      box.textContent='Your song is being created with vocals. It will appear in your song library when ready.';
      await window.roRecoverTrebloSong(id);
    }catch(error){box.textContent=error.message||'Song generation is unavailable. Please retry.'}
    finally{window.roSongBusy=false;if(button)button.disabled=false;window.roRefreshMusicCredits?.()}
  };
})();
