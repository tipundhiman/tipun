<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Your Password | RhymeOrbit</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0e">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh;margin:0;color:#f8f6f3;background:radial-gradient(ellipse at top,#2c2430,#0b0b0e 70%);display:grid;place-items:center;padding:24px}
.panel{width:min(100%,480px);padding:clamp(24px,5vw,40px);border:1px solid #ddbc9055;border-radius:25px;background:#17171d;box-shadow:0 30px 75px #0008}
.brand{font-size:24px;font-weight:800;color:#f8f6f3;text-decoration:none}.brand span{color:#e5c9a2}
h1{font-size:clamp(28px,6vw,38px);line-height:1.12;letter-spacing:-1px;margin:36px 0 10px}p{color:#bbb5c0;line-height:1.55}
label{display:block;margin:20px 0 7px;font-weight:700;font-size:14px}
input{background:#0d0d12;border:1px solid #625d67;border-radius:12px;color:white;width:100%;padding:14px;font:inherit}
input:focus{outline:2px solid #e5c9a2;outline-offset:2px}
button{width:100%;border:0;border-radius:13px;margin-top:25px;padding:14px;background:#e5c9a2;color:#19161c;font:750 15px system-ui;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
#status{min-height:44px;margin:15px 0;white-space:pre-wrap}
a{color:#e5c9a2}
footer{font-size:13px;margin-top:20px;color:#aaa}
</style>
</head><body>
<main class="panel"><a class="brand" href="/">Rhyme<span>Orbit</span></a>
<h1>Set a new password.</h1>
<p>Choose a strong password for your RhymeOrbit account. This page only works with a valid recovery session.</p>
<p id="status" role="status" aria-live="polite">Checking your secure reset link…</p>
<form id="resetForm" hidden>
<label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="At least 8 characters">
<label for="repeatPassword">Confirm new password</label><input id="repeatPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
<button type="submit" id="savePassword">Update password</button>
</form>
<footer><a href="/#home">Return to RhymeOrbit</a> · <a href="/privacy">Privacy</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/reset-password.js"></script>
</body></html>
